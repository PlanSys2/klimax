# Wheel of the Python module. Kairos must be installed (with kairos::core, the default) where
# CMake finds it (CMAKE_PREFIX_PATH); the wheel carries it inside and needs nothing at run time.
[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "klimax-planner"
dynamic = ["version"]
description = "Klimax: an HTN planner for HDDL, in Python"
readme = "python/README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Francisco Martín Rico" }]
requires-python = ">=3.10"
keywords = ["planning", "htn", "hddl", "hierarchical planning", "robotics", "plansys2"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/PlanSys2/klimax"

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build-wheel/{wheel_tag}"
wheel.packages = ["python/klimax"]
wheel.py-api = "cp312"
install.components = ["python"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
KLIMAX_BUILD_PYTHON = "ON"
KLIMAX_BUILD_TESTS = "OFF"
KLIMAX_BUILD_CLI = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'VERSION\s+(?P<value>\d+\.\d+\.\d+)'

# Wheels for Linux (x86-64, arm64, manylinux_2_28), each tested with the Python suite. Kairos, at
# the version Klimax needs, is built inside the container first
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
skip = "*-musllinux_*"
test-requires = "pytest"
test-command = "pytest -q {project}/python/tests"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
before-all = """
git clone --depth 1 --branch 1.0.7 https://github.com/PlanSys2/kairos.git /tmp/kairos &&
cmake -S /tmp/kairos -B /tmp/kairos-build -DCMAKE_BUILD_TYPE=Release -DKAIROS_SHARED=OFF \
  -DKAIROS_BUILD_TESTS=OFF -DKAIROS_BUILD_CLI=OFF -DCMAKE_INSTALL_PREFIX=/opt/kairos &&
cmake --build /tmp/kairos-build -j4 && cmake --install /tmp/kairos-build
"""
environment = { CMAKE_PREFIX_PATH = "/opt/kairos" }
