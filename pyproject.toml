# Wheel of the Python module. Kairos must be installed with -DKAIROS_INSTALL_CORE=ON where CMake
# finds it (CMAKE_PREFIX_PATH); the wheel carries it inside and needs nothing at run time.
[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "klimax-planner"
dynamic = ["version"]
description = "Klimax: an HTN planner for HDDL, in Python"
readme = "python/README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Francisco Martín Rico" }]
requires-python = ">=3.10"
keywords = ["planning", "htn", "hddl", "hierarchical planning", "robotics", "plansys2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/PlanSys2/klimax"

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build-wheel/{wheel_tag}"
wheel.packages = ["python/klimax"]
wheel.py-api = "cp312"
install.components = ["python"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
KLIMAX_BUILD_PYTHON = "ON"
KLIMAX_BUILD_TESTS = "OFF"
KLIMAX_BUILD_CLI = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'VERSION\s+(?P<value>\d+\.\d+\.\d+)'
